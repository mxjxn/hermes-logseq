[package]
name = "hermes-logseq-desktop"
version = "0.1.0"
description = "Local-first Logseq-compatible notes desktop (PoC)"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
axum = "0.7"
tokio = { version = "1", features = ["rt", "net", "macros"] }
reqwest = { version = "0.12", default-features = false }
tower-http = { version = "0.6", features = ["fs"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
